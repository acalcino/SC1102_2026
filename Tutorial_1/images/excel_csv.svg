<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>

  <!-- ================= LEFT: spreadsheet ================= -->
  <text x="40" y="38" font-size="19" font-weight="700" fill="#1f3a4d">A spreadsheet</text>
  <text x="40" y="60" font-size="14" fill="#5b7186">fisheries.xlsx — rows, columns, formatting</text>

  <g>
    <!-- outer frame -->
    <rect x="40" y="78" width="380" height="220" fill="#ffffff" stroke="#b9c6d1" stroke-width="1.5" rx="3"/>

    <!-- column letter strip -->
    <rect x="40" y="78" width="380" height="26" fill="#eef2f5" stroke="#b9c6d1" stroke-width="1.5"/>
    <text x="82"  y="96" font-size="12" fill="#7b8b99" text-anchor="middle">A</text>
    <text x="164" y="96" font-size="12" fill="#7b8b99" text-anchor="middle">B</text>
    <text x="246" y="96" font-size="12" fill="#7b8b99" text-anchor="middle">C</text>
    <text x="328" y="96" font-size="12" fill="#7b8b99" text-anchor="middle">D</text>
    <text x="396" y="96" font-size="12" fill="#7b8b99" text-anchor="middle">E</text>

    <!-- row number strip -->
    <rect x="40" y="78" width="24" height="220" fill="#eef2f5" stroke="#b9c6d1" stroke-width="1.5"/>
    <text x="52" y="124" font-size="12" fill="#7b8b99" text-anchor="middle">1</text>
    <text x="52" y="156" font-size="12" fill="#7b8b99" text-anchor="middle">2</text>
    <text x="52" y="188" font-size="12" fill="#7b8b99" text-anchor="middle">3</text>
    <text x="52" y="220" font-size="12" fill="#7b8b99" text-anchor="middle">4</text>
    <text x="52" y="252" font-size="12" fill="#7b8b99" text-anchor="middle">5</text>

    <!-- header row highlight -->
    <rect x="64" y="104" width="356" height="32" fill="#dbe7ef"/>

    <!-- grid lines -->
    <g stroke="#dfe6ec" stroke-width="1">
      <line x1="64" y1="136" x2="420" y2="136"/>
      <line x1="64" y1="168" x2="420" y2="168"/>
      <line x1="64" y1="200" x2="420" y2="200"/>
      <line x1="64" y1="232" x2="420" y2="232"/>
      <line x1="64" y1="264" x2="420" y2="264"/>
      <line x1="123" y1="104" x2="123" y2="298"/>
      <line x1="205" y1="104" x2="205" y2="298"/>
      <line x1="287" y1="104" x2="287" y2="298"/>
      <line x1="369" y1="104" x2="369" y2="298"/>
    </g>

    <!-- header text -->
    <g font-size="12.5" font-weight="700" fill="#1f3a4d">
      <text x="70"  y="125">catch_id</text>
      <text x="129" y="125">date</text>
      <text x="211" y="125">site</text>
      <text x="293" y="125">species</text>
      <text x="375" y="125">sex</text>
    </g>

    <!-- data -->
    <g font-size="12" fill="#33475b">
      <text x="70"  y="157">C1968</text>
      <text x="129" y="157">2023-01-01</text>
      <text x="211" y="157">Green Isl…</text>
      <text x="293" y="157">Red Emp…</text>
      <text x="375" y="157">F</text>

      <text x="70"  y="189">C1553</text>
      <text x="129" y="189">2023-01-01</text>
      <text x="211" y="189">Michaelm…</text>
      <text x="293" y="189">Mangrove…</text>
      <text x="375" y="189">M</text>

      <text x="70"  y="221">C0472</text>
      <text x="129" y="221">2023-01-02</text>
      <text x="211" y="221">Green Isl…</text>
      <text x="293" y="221">Coral Tro…</text>
      <text x="375" y="221">F</text>

      <text x="70"  y="253">C1104</text>
      <text x="129" y="253">2023-01-02</text>
      <text x="211" y="253">Upolu Cay</text>
      <text x="293" y="253">Red Emp…</text>
      <text x="375" y="253">M</text>
    </g>
    <text x="70" y="285" font-size="12" fill="#9aa9b6">⋮</text>
  </g>

  <!-- ================= ARROW ================= -->
  <g>
    <line x1="445" y1="196" x2="555" y2="196" stroke="#2b6a8f" stroke-width="3"/>
    <polygon points="555,196 541,189 541,203" fill="#2b6a8f"/>
    <text x="500" y="171" font-size="12.5" font-weight="700" fill="#2b6a8f" text-anchor="middle">File &gt; Save As</text>
    <text x="500" y="187" font-size="12.5" font-weight="700" fill="#2b6a8f" text-anchor="middle">CSV format</text>
  </g>

  <!-- ================= RIGHT: plain text ================= -->
  <text x="560" y="38" font-size="19" font-weight="700" fill="#1f3a4d">A plain text file</text>
  <text x="560" y="60" font-size="14" fill="#5b7186">fisheries.csv — one line per row, values split by commas</text>

  <rect x="560" y="78" width="400" height="220" fill="#f7f9fa" stroke="#b9c6d1" stroke-width="1.5" rx="3"/>
  <g font-family="Courier New, Courier, monospace" font-size="11.5">
    <text x="574" y="106" fill="#1f3a4d" font-weight="700">catch_id<tspan fill="#c1440e">,</tspan>date<tspan fill="#c1440e">,</tspan>site<tspan fill="#c1440e">,</tspan>species<tspan fill="#c1440e">,</tspan>sex</text>
    <text x="574" y="134" fill="#33475b">C1968<tspan fill="#c1440e">,</tspan>2023-01-01<tspan fill="#c1440e">,</tspan>Green Island<tspan fill="#c1440e">,</tspan></text>
    <text x="574" y="150" fill="#33475b">Red Emperor<tspan fill="#c1440e">,</tspan>F</text>
    <text x="574" y="178" fill="#33475b">C1553<tspan fill="#c1440e">,</tspan>2023-01-01<tspan fill="#c1440e">,</tspan>Michaelmas Cay<tspan fill="#c1440e">,</tspan></text>
    <text x="574" y="194" fill="#33475b">Mangrove Jack<tspan fill="#c1440e">,</tspan>M</text>
    <text x="574" y="222" fill="#33475b">C0472<tspan fill="#c1440e">,</tspan>2023-01-02<tspan fill="#c1440e">,</tspan>Green Island<tspan fill="#c1440e">,</tspan></text>
    <text x="574" y="238" fill="#33475b">Coral Trout<tspan fill="#c1440e">,</tspan>F</text>
    <text x="574" y="266" fill="#9aa9b6">...</text>
  </g>

  <!-- caption -->
  <rect x="40" y="318" width="920" height="42" fill="#eef4f8" rx="4"/>
  <text x="60" y="336" font-size="13" fill="#1f3a4d" font-weight="700">Same data, no spreadsheet.</text>
  <text x="60" y="353" font-size="13" fill="#33475b">A CSV keeps only the values and the commas that separate them — no colours, no fonts, no formulas. That is exactly what R wants.</text>
</svg>
